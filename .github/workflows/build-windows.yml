name: Windows Setup Derle

# Windows sunucusunda .exe + Setup.exe üretir ve "Releases" altına koyar.
# Elle çalıştırmak için: GitHub > Actions > "Windows Setup Derle" > Run workflow.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/contract-portfolio-powerbi-7128bs
    paths:
      - contract-portfolio-desktop/**
      - .github/workflows/build-windows.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"          # Windows'ta Türkçe çıktı (cp1252) hatalarını önler
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        working-directory: contract-portfolio-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pyinstaller-hooks-contrib pillow pythonnet

      - name: İkon üret
        run: python assets/make_icon.py

      - name: PyInstaller (.exe)
        run: pyinstaller --noconfirm build.spec

      - name: Inno Setup kur
        run: choco install innosetup --no-progress -y

      - name: Setup.exe derle
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss'

      - name: Portable ZIP
        run: powershell Compress-Archive -Path dist\SozlesmePortfoyPaneli\* -DestinationPath installer\Output\SozlesmePortfoyPaneli_Portable.zip -Force

      - name: Artifact yükle (Actions sekmesinden inilebilir)
        uses: actions/upload-artifact@v4
        with:
          name: SozlesmePortfoyPaneli-Windows
          path: |
            contract-portfolio-desktop/installer/Output/SozlesmePortfoyPaneli_Setup.exe
            contract-portfolio-desktop/installer/Output/SozlesmePortfoyPaneli_Portable.zip

      - name: Release'e koy (doğrudan indirme linki)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build
          name: Sözleşme Portföy Paneli — Windows
          body: |
            Otomatik derlenen Windows sürümü.
            • **SozlesmePortfoyPaneli_Setup.exe** — çift tıkla kur (yönetici gerekmez).
            • **SozlesmePortfoyPaneli_Portable.zip** — kurulumsuz; aç, klasördeki .exe'yi çalıştır.
          prerelease: true
          files: |
            contract-portfolio-desktop/installer/Output/SozlesmePortfoyPaneli_Setup.exe
            contract-portfolio-desktop/installer/Output/SozlesmePortfoyPaneli_Portable.zip
